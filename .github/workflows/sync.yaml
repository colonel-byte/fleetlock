name: Rebase Upstream
on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  sync:
    name: Rebase, build, and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    env:
      IMAGE_NAME: ${{ github.repository }}
      REGISTRY: ghcr.io
    steps:
      - name: Get Release Please token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_GITHUB_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_GITHUB_APP_SECRET }}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 10
          token: ${{ steps.app-token.outputs.token }}

      # borrowed from https://github.com/opentofu/scripts/blob/main/.github/workflows/sync.yml
      - name: Setup upstream
        run: |
          parent_owner=$(gh repo view $GITHUB_REPOSITORY --json parent --jq '.parent.owner.login')
          parent_name=$(gh repo view $GITHUB_REPOSITORY --json parent --jq '.parent.name')
          parent_repo="https://github.com/${parent_owner}/${parent_name}.git"
          echo "${parent_repo}"
          git remote add upstream "${parent_repo}"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Rebase the fault branch
        run: |
          git config --global user.email "269297074+colonel-byte-release-please[bot]@users.noreply.github.com"
          git config --global user.name "colonel-byte-release-please[bot]"

          default_branch=$(git symbolic-ref --short HEAD)
          git pull --rebase upstream "$default_branch"
          git push origin "$default_branch" --force

      - name: Fetch tags from upstream
        run: |
          git fetch --tags --force upstream
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Push tags to origin
        run: |
          git push --tags origin

      - name: Change base image in docker file
        run: |
          sed -i -E 's#^FROM docker.io/alpine:.+$#FROM cgr.dev/chainguard/wolfi-base:latest#g' ./Dockerfile

      # borrowed from https://github.com/poseidon/fleetlock/compare/main...craigcabrey:fleetlock:main
      - name: Build Image
        id: build-image
        uses: redhat-actions/buildah-build@7a95fa7ee0f02d552a32753e7414641a04307056 # v2.13
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: latest ${{ github.sha }}
          containerfiles: |
            ./Dockerfile

      - name: Log in to the GitHub Container registry
        if: github.event_name != 'pull_request'
        uses: redhat-actions/podman-login@4934294ad0449894bcd1e9f191899d7292469603 # v1.7
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GitHub Container Repository
        if: github.event_name != 'pull_request'
        uses: redhat-actions/push-to-registry@5ed88d269cf581ea9ef6dd6806d01562096bee9c # v2.8
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: ${{ env.REGISTRY }}
